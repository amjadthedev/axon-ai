plugins {
    id 'fabric-loom' version '1.19.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    flatDir { dirs 'libs' }
    maven { url "https://maven.minecraftforge.net/" }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "axon" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    include implementation("io.github.sashirestela:simple-openai:3.22.2")
    include implementation("io.github.sashirestela:slimvalidator:1.4.2")
    include implementation("io.github.sashirestela:cleverclient:2.2.3")
    include implementation("com.github.victools:jsonschema-generator:4.38.0")
    include implementation("com.github.victools:jsonschema-module-jackson:4.38.0")
    include implementation("com.fasterxml:classmate:1.7.3")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
